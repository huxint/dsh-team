<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dsh-team stage</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--dsw-alias-bg-base); }
  #stage { width: 100vw; height: 100vh; }
  /* StateDot, the one platform primitive the stage draws (see the primitives
     package's StateDot stylesheet; animations stay off under reduced motion). */
  .dot { position: relative; display: inline-block; flex: none; }
  .dot::before { content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: currentColor; opacity: 0.1; }
  .dot::after { content: ''; position: absolute; inset: 20%; border-radius: 50%;
    background: currentColor; }
  .dot[data-state='done'] { color: var(--dsw-alias-state-success-primary); }
  .dot-matrix { flex: none; color: var(--dsw-static-deepseek-450); }
  .dot-matrix .dot-cell { fill: currentColor; opacity: 1; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="./main.tsx"></script>
</body>
</html>
